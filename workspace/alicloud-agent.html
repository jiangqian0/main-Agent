<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿里云 Agent 管理平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6a00;
            --secondary-color: #1677ff;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --danger-color: #ff4d4f;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-radius: 8px;
            --box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 0;
            text-align: center;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            box-shadow: var(--box-shadow);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card .icon {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .stat-card .count {
            font-size: 2em;
            font-weight: bold;
            display: block;
            margin: 10px 0;
        }

        .stat-card .label {
            color: #666;
            font-size: 0.9em;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .agent-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .agent-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .agent-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .agent-header h3 {
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .agent-header .agent-id {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .agent-body {
            padding: 20px;
        }

        .agent-info {
            margin-bottom: 15px;
        }

        .agent-info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .agent-info-item:last-child {
            border-bottom: none;
        }

        .agent-info-item .label {
            color: #666;
            font-weight: 500;
        }

        .agent-info-item .value {
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-active {
            background: rgba(82, 196, 26, 0.1);
            color: var(--success-color);
        }

        .status-inactive {
            background: rgba(250, 173, 20, 0.1);
            color: var(--warning-color);
        }

        .status-error {
            background: rgba(255, 77, 79, 0.1);
            color: var(--danger-color);
        }

        .agent-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #e65e00;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background: #0d66d0;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #49a916;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background: #e64547;
            transform: translateY(-2px);
        }

        .chat-container {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 25px;
            margin-bottom: 30px;
        }

        .chat-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e8e8e8;
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message-user {
            background: var(--primary-color);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .message-agent {
            background: #e8e8e8;
            color: var(--text-color);
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #d9d9d9;
            border-radius: var(--border-radius);
            font-size: 1em;
        }

        .chat-input input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        @media (max-width: 768px) {
            .stats-grid,
            .agents-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .chat-messages {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 阿里云 Agent 管理平台</h1>
            <p>智能 Agent 管理、监控与交互</p>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">📊</div>
                <span class="count" id="totalAgents">0</span>
                <span class="label">总 Agent 数量</span>
            </div>
            <div class="stat-card">
                <div class="icon">✅</div>
                <span class="count" id="activeAgents">0</span>
                <span class="label">活跃 Agent</span>
            </div>
            <div class="stat-card">
                <div class="icon">⚡</div>
                <span class="count" id="totalRequests">0</span>
                <span class="label">今日请求数</span>
            </div>
            <div class="stat-card">
                <div class="icon">⏱️</div>
                <span class="count" id="avgResponse">0ms</span>
                <span class="label">平均响应时间</span>
            </div>
        </div>

        <!-- Agent 列表 -->
        <h2 style="margin-bottom: 20px; color: var(--text-color);">Agent 列表</h2>
        <div class="agents-grid" id="agentsContainer">
            <!-- Agent 卡片将通过 JavaScript 动态生成 -->
        </div>

        <!-- Chat 界面 -->
        <div class="chat-container">
            <div class="chat-header">
                <h2>💬 与 Agent 对话</h2>
                <p style="color: #666; margin-top: 5px;">选择一个 Agent 开始对话</p>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="loading">暂无对话，请选择一个 Agent</div>
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="输入消息..." disabled>
                <button class="btn btn-primary" id="sendBtn" disabled>发送</button>
            </div>
        </div>
    </div>

    <script>
        // 模拟的 Agent 数据
        const agents = [
            {
                id: 'agent-001',
                name: '客服助手',
                status: 'active',
                type: 'Customer Service',
                version: 'v1.2.0',
                lastActive: '2024-01-15 10:30:00',
                requests: 1250,
                responseTime: '120ms'
            },
            {
                id: 'agent-002',
                name: '数据分析',
                status: 'active',
                type: 'Data Analysis',
                version: 'v2.0.1',
                lastActive: '2024-01-15 09:45:00',
                requests: 890,
                responseTime: '230ms'
            },
            {
                id: 'agent-003',
                name: '内容生成',
                status: 'inactive',
                type: 'Content Generation',
                version: 'v1.5.0',
                lastActive: '2024-01-14 18:20:00',
                requests: 560,
                responseTime: '180ms'
            },
            {
                id: 'agent-004',
                name: '代码助手',
                status: 'active',
                type: 'Code Assistant',
                version: 'v3.1.0',
                lastActive: '2024-01-15 11:15:00',
                requests: 2100,
                responseTime: '150ms'
            }
        ];

        let currentAgent = null;
        let chatHistory = [];

        // 初始化页面
        function init() {
            renderStats();
            renderAgents();
            setupEventListeners();
        }

        // 渲染统计信息
        function renderStats() {
            const total = agents.length;
            const active = agents.filter(a => a.status === 'active').length;
            const totalRequests = agents.reduce((sum, a) => sum + a.requests, 0);
            const avgResponse = Math.round(agents.reduce((sum, a) => sum + parseInt(a.responseTime), 0) / agents.length);

            document.getElementById('totalAgents').textContent = total;
            document.getElementById('activeAgents').textContent = active;
            document.getElementById('totalRequests').textContent = totalRequests.toLocaleString();
            document.getElementById('avgResponse').textContent = `${avgResponse}ms`;
        }

        // 渲染 Agent 列表
        function renderAgents() {
            const container = document.getElementById('agentsContainer');
            container.innerHTML = agents.map(agent => `
                <div class="agent-card">
                    <div class="agent-header">
                        <h3>${agent.name}</h3>
                        <div class="agent-id">ID: ${agent.id}</div>
                    </div>
                    <div class="agent-body">
                        <div class="agent-info">
                            <div class="agent-info-item">
                                <span class="label">状态</span>
                                <span class="value">
                                    <span class="status-badge status-${agent.status}">${getStatusText(agent.status)}</span>
                                </span>
                            </div>
                            <div class="agent-info-item">
                                <span class="label">类型</span>
                                <span class="value">${agent.type}</span>
                            </div>
                            <div class="agent-info-item">
                                <span class="label">版本</span>
                                <span class="value">${agent.version}</span>
                            </div>
                            <div class="agent-info-item">
                                <span class="label">最后活跃</span>
                                <span class="value">${agent.lastActive}</span>
                            </div>
                            <div class="agent-info-item">
                                <span class="label">请求数</span>
                                <span class="value">${agent.requests.toLocaleString()}</span>
                            </div>
                            <div class="agent-info-item">
                                <span class="label">响应时间</span>
                                <span class="value">${agent.responseTime}</span>
                            </div>
                        </div>
                        <div class="agent-actions">
                            <button class="btn btn-primary select-agent" data-id="${agent.id}">选择</button>
                            <button class="btn btn-secondary">详情</button>
                            <button class="btn ${agent.status === 'active' ? 'btn-danger' : 'btn-success'} toggle-status" data-id="${agent.id}">
                                ${agent.status === 'active' ? '停用' : '启用'}
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'active': '🟢 活跃',
                'inactive': '🟡 闲置',
                'error': '🔴 错误'
            };
            return statusMap[status] || status;
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 选择 Agent
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('select-agent')) {
                    const agentId = e.target.dataset.id;
                    selectAgent(agentId);
                }
            });

            // 发送消息
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        }

        // 选择 Agent
        function selectAgent(agentId) {
            currentAgent = agents.find(a => a.id === agentId);
            chatHistory = [];
            
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = `<div class="message message-agent">👋 你好！我是 ${currentAgent.name}，很高兴为您服务！</div>`;
            
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('messageInput').focus();
        }

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !currentAgent) return;
            
            const chatMessages = document.getElementById('chatMessages');
            
            // 添加用户消息
            chatMessages.innerHTML += `<div class="message message-user">${message}</div>`;
            input.value = '';
            
            // 模拟 Agent 响应
            setTimeout(() => {
                const responses = [
                    `收到您的消息："${message}"，我会尽快处理。`,
                    `关于 "${message}"，我建议您可以...`,
                    `正在为您处理 "${message}" 相关的请求...`,
                    `您的问题 "${message}" 已经记录，我会继续跟进。`
                ];
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                
                chatMessages.innerHTML += `<div class="message message-agent">${randomResponse}</div>`;
                
                // 滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 800);
            
            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 初始化页面
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
